<!DOCTYPE html>
<html lang="fr" dir="ltr" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" >
  <head>
    <meta charset="utf-8">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <!--[if mso]> <style> td,th,div,p,a,h1,h2,h3,h4,h5,h6 {font-family: Arial, Helvetica, sans-serif; mso-line-height-rule: exactly;} </style> <![endif]-->
    <style>
      @media (prefers-color-scheme: dark) {
        [data-dark="page"] {
          background-color: #14161a !important;
        }
        [data-dark="surface"] {
          background-color: #23262b !important;
        }
        [data-dark="body"] {
          color: #e9eaec !important;
        }
        [data-dark="body"] td {
          color: #e9eaec !important;
        }
        [data-dark="body"] div {
          color: #e9eaec !important;
        }
        [data-dark="body"] p {
          color: #e9eaec !important;
        }
        [data-dark="body"] h1 {
          color: #e9eaec !important;
        }
        [data-dark="body"] h2 {
          color: #e9eaec !important;
        }
        [data-dark="body"] h3 {
          color: #e9eaec !important;
        }
        [data-dark="body"] li {
          color: #e9eaec !important;
        }
        [data-dark="muted"] {
          color: #b7bbc2 !important;
        }
        [data-dark="muted"] p {
          color: #b7bbc2 !important;
        }
      }
    </style>
  </head>
  <body xml:lang="fr" dir="ltr" data-dark="page" style="margin: 0; width: 100%; background-color: #f8f8f8; padding: 0; word-break: break-word;">
    
    <span style="display:none;">
      <!--[if mso]> <xml> <o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings> <w:WordDocument><w:DontUseAdvancedTypographyReadingMail /></w:WordDocument> </xml> <![endif]-->
    </span>
    <div role="article" aria-roledescription="email" lang="fr" dir="ltr" class="font-body" data-dark="page" style="background-color: #f8f8f8; font-family: Nunito, 'Avenir LT Std', Arial, Helvetica, sans-serif; font-size: 14px; line-height: 20px; color: #1c1c1c;">
      <!--[if mso]><table role="none" cellpadding="0" cellspacing="0" style="width: 600px" align="center"><tr><td style="padding: 32px 24px"><![endif]-->
      <div style="margin: 0 auto; max-width: 600px; padding: 32px 24px;">
        <table role="presentation" style="width: 100%;" cellpadding="0" cellspacing="0">
          <tr>
            <td style="padding-bottom: 20px;"></td>
          </tr>
          <tr><td bgcolor="#e6007e" style="height: 3px; font-size: 0; line-height: 3px;">&zwj;</td></tr>
        </table>
        <table role="presentation" data-dark="surface" style="width: 100%; background-color: #fff;" cellpadding="0" cellspacing="0">
          <tr>
            <td data-dark="body" style="padding: 24px; font-size: 14px; line-height: 24px; color: #1c1c1c;">
              <h1 style="margin: 0 0 12px; font-family: Quicksand, 'Trebuchet MS', Arial, Helvetica, sans-serif; font-size: 18px; line-height: 28px; font-weight: 700; color: #1c1c1c;">Votre demande a été enregistrée</h1>
              <p style="margin: 0 0 16px; font-size: 14px; line-height: 24px; color: #1c1c1c;">Nous avons bien reçu votre demande. Un agent du service population la traitera dans les cinq jours ouvrables.</p>
              
            </td>
          </tr>
        </table>
        <table role="presentation" style="width: 100%;" cellpadding="0" cellspacing="0">
          <tr>
            <td data-dark="muted" style="padding-top: 20px; font-size: 12px; line-height: 20px; color: #3c3c3b;">
              
              <p style="margin: 0; font-size: 12px; line-height: 20px; color: #3c3c3b;">Ce message a été envoyé automatiquement. Merci de ne pas y répondre.</p>
            </td>
          </tr>
        </table>
      </div>
      <!--[if mso]></td></tr></table><![endif]-->
    </div>
  </body>
</html>
