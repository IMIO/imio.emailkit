# Acceptance harness for the Phase 4 acceptance test: `git clone && buildout && bin/compile-emails`.
#
# This repository is developed with `uv` + `mxdev`, not with buildout -- buildout
# is how iMio *deploys*. But the Phase 4 acceptance criterion is a buildout run,
# so one has to exist to run it against, and this is it. `setup.py` in both
# distributions is the seam that makes it possible: it is there precisely so a
# PEP 621 package can still be a zc.buildout develop egg.
#
# Deliberately NOT called `buildout.cfg`: nothing in the normal `make` workflow
# reads this file, and `make install` / `make test` keep working untouched.
#
#   make buildout-test        # the whole acceptance test
#   make buildout-clean       # remove everything it writes
#
# This file resolves eggs **from an existing environment, offline**: point
# `eggs-directory` at the development virtualenv's `site-packages` and buildout
# satisfies `imio.emailkit`'s dependency tree from what is already installed, with
# no download and no writes into it. `make buildout-test` supplies the path.
# `test-buildout-pypi.cfg` is the same harness resolving from PyPI instead, which
# is the literal "git clone && buildout" and needs a network.
#
# Either way the recipe does the same work: develop-install both distributions,
# resolve the part's working set, collect the `imio.emailkit.templates` entry
# points, resolve the design kit out of the `imio.emailkit` egg, and generate the
# three scripts.
#
# What this harness must prove, beyond generating the scripts: **a plain buildout
# run invokes no Node at all.** `compile-on-install` is left at its default below,
# and `make buildout-test` runs buildout with a PATH from which `node`, `npm` and
# `npx` have been removed. If that ever stops passing, Node has leaked into a
# deployment path in front of ~350 production applications, which is what this
# harness exists to prevent.

[buildout]
develop =
    .
    recipe
# A throwaway *external* consumer addon. It is here because the recipe's whole
# job is to serve addons it does not own, and because `imio.emailkit` alone
# cannot exercise two things: the in-package `emails/` layout, and the
# `emails/.kit/` wiring contract that is the only way a real consumer -- whose
# kit sits in site-packages -- can reach the design system. See
# `recipe/tests/consumer/pyproject.toml`.
    recipe/tests/consumer
parts = emails
newest = false
offline = true
# Overridden by `make buildout-test`, which computes it from the venv in use. The
# default is the ordinary buildout location, so that `test-buildout-pypi.cfg` --
# which flips `offline` back off -- gets a normal egg cache.
eggs-directory = ${buildout:directory}/eggs
allow-picked-versions = true
show-picked-versions = false

# The usage block, verbatim apart from `eggs`: a real deployment writes
# `eggs = ${instance:eggs}`, and there is no `[instance]` part here.
[emails]
recipe = imio.recipe.emailkit
eggs =
    imio.emailkit
    emailkitdemo
# compile-on-install = false   (default -- do not turn this on here, ever)
# kit-mode = path | copy       (default: path)
# node-bin = node
