# Acceptance harness: `git clone && buildout && bin/compile-emails`.
# Not called `buildout.cfg`, so `make install`/`make test` are unaffected.
#
#   make buildout-test        # the whole acceptance test
#   make buildout-clean       # remove everything it writes
#
# Resolves eggs offline from the development virtualenv's site-packages.
# `test-buildout-pypi.cfg` is the same harness resolving from PyPI instead.
#
# Must prove buildout invokes no Node: `make buildout-test` runs it with
# `node`, `npm` and `npx` removed from PATH.

[buildout]
develop =
    .
    recipe
# A throwaway external consumer addon; exercises the in-package `emails/`
# layout and the `emails/.kit/` wiring contract. See
# `recipe/tests/consumer/pyproject.toml`.
    recipe/tests/consumer
parts = emails
newest = false
offline = true
# Overridden by `make buildout-test`, computed from the venv in use.
eggs-directory = ${buildout:directory}/eggs
allow-picked-versions = true
show-picked-versions = false

# A real deployment writes `eggs = ${instance:eggs}`; spelled out directly
# since there is no `[instance]` part here.
[emails]
recipe = imio.recipe.emailkit
eggs =
    imio.emailkit
    emailkitdemo
# compile-on-install = false   (default -- do not turn this on here, ever)
# kit-mode = path | copy       (default: path)
# node-bin = node
