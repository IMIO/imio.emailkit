[project]
name = "imio.emailkit"
dynamic = ["version"]
description = "Transactional email templating and sending for the iMio Plone ecosystem, built on Maizzle 6"
readme = "README.md"
license = "GPL-2.0-only"
# CI tests only 3.12/3.13/3.14.
requires-python = ">=3.12,<3.15"
authors = [{ name = "Antoine Duchêne", email = "antoine.duchene@imio.be" }]
keywords = ["CMS", "Plone", "Python", "email", "Maizzle"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Plone",
    "Framework :: Plone :: 6.0",
    "Framework :: Plone :: 6.1",
    "Framework :: Plone :: 6.2",
    "Framework :: Plone :: Addon",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Products.CMFPlone",
    "plone.api",
    "z3c.jbot",
]

[project.optional-dependencies]
test = [
    "plone.app.testing",
    "plone.classicui",
    "pytest",
    "pytest-cov",
    "pytest-plone>=1.0.0a2",
]
release = ["zest.releaser[recommended]", "zestreleaser.towncrier", "zest.pocompile"]

[project.urls]
Homepage = "https://github.com/IMIO/imio.emailkit"
PyPI = "https://pypi.org/project/imio.emailkit"
Source = "https://github.com/IMIO/imio.emailkit"
Tracker = "https://github.com/IMIO/imio.emailkit/issues"

[project.entry-points."z3c.autoinclude.plugin"]
target = "plone"

[tool.uv]
managed = false

[build-system]
# setuptools, not hatchling: zc.buildout's ``develop`` needs ``setup.py``.
# >=77: needed to understand the PEP 639 SPDX `license` expression below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "imio.emailkit.__version__" }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
# PEP 420 namespace package: no __init__.py, by design.
namespaces = true

[tool.setuptools.package-data]
# Ships the kit's `.vue`/`.js`/`.css` sources too, so `bin/compile-emails`
# can resolve the design system from the installed distribution.
"*" = [
    "*.zcml", "*.xml", "*.pt", "*.pot", "*.po", "*.mo", "*.txt",
    "*.css", "*.js", "*.vue", "*.png", "*.woff2",
]

[tool.towncrier]
directory = "news/"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
template = "news/.changelog_template.jinja"
issue_format = "[#{issue}](https://github.com/IMIO/imio.emailkit/issues/{issue})"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes:"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New features:"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes:"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "Internal:"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation:"
showcontent = true

[[tool.towncrier.type]]
directory = "tests"
name = "Tests"
showcontent = true

[tool.ruff]
target-version = "py312"
line-length = 88
fix = true
# `.claude/` has illustrative, non-runnable examples. `docs/` is excluded
# because ruff's preview formatter rewrites fenced Python blocks in prose.
exclude = [".claude", "docs"]
lint.select = [
    "YTT", "S", "B", "A", "C4", "T10", "SIM", "C90",
    "E", "W", "F", "PGH", "UP", "RUF",
]
lint.ignore = ["E731"]

[tool.ruff.lint.isort]
case-sensitive = false
no-sections = true
force-single-line = true
from-first = true
lines-after-imports = 2
lines-between-types = 1
order-by-type = false

[tool.ruff.format]
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "RUF001", "S101"]
# A pytest base class that consumer add-ons subclass; its `assert` calls are
# test assertions, not a library concern.
"src/imio/emailkit/golden.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["imio.emailkit", "tests"]
branch = true
parallel = true
omit = ["src/imio/emailkit/locales/*.py"]

# Without this list, check-manifest stops every release to ask about it.
[tool.check-manifest]
ignore = [
    "docs",
    "docs/**",
    "emails",
    "emails/**",
    "recipe",
    "recipe/**",
    "scripts",
    "scripts/**",
    "instance",
    "instance/**",
    "Makefile",
    "SKILL.md",
    "*.cfg",
    "mx.ini",
    "instance.yaml",
    ".editorconfig",
]
# The compiled catalogs are committed: an installed egg cannot run msgfmt.
ignore-bad-ideas = [
    "src/imio/emailkit/locales/*/LC_MESSAGES/*.mo",
]

[tool.zest-releaser]
python-file-with-version = "src/imio/emailkit/__init__.py"
# Prefixed: this repository ships two distributions sharing one tag namespace.
tag-format = "imio.emailkit-{version}"
tag-message = "Release imio.emailkit {version}"
