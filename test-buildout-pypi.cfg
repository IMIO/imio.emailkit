# `git clone && buildout`, downloading from PyPI instead of an existing
# environment. Needs a network, so `make buildout-test` uses
# `test-buildout.cfg` instead; this one exists to check a clean checkout.
#
#   pip install zc.buildout
#   buildout -c test-buildout-pypi.cfg
#   bin/compile-emails
#
# Keep the Plone version in step with the Makefile's default.

[buildout]
extends =
    test-buildout.cfg
    https://dist.plone.org/release/6.2.1/versions.cfg
offline = false
newest = false
# The develop eggs are unpinned by definition.
[versions]
imio.emailkit =
imio.recipe.emailkit =
