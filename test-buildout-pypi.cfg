# The Phase 4 acceptance test in its most literal form: `git clone && buildout`
# with nothing installed beforehand. Same part, same recipe as
# `test-buildout.cfg`; the only difference is where the eggs come from.
#
#   pip install zc.buildout
#   buildout -c test-buildout-pypi.cfg
#   bin/compile-emails
#
# This downloads `imio.emailkit`'s whole dependency tree -- Plone included --
# into `eggs/`, pinned by Plone's own versions file. It needs a network and it is
# slow, which is why it is not what `make buildout-test` runs; it exists so that
# the claim "this works from a clean checkout" can be checked rather than
# asserted.
#
# The Plone version is the same one the Makefile defaults to; keep them in step.

[buildout]
extends =
    test-buildout.cfg
    https://dist.plone.org/release/6.2.1/versions.cfg
offline = false
newest = false
# The develop eggs are the two distributions in this checkout, so they are
# unpinned by definition and Plone's versions file must not be consulted for them.
[versions]
imio.emailkit =
imio.recipe.emailkit =
