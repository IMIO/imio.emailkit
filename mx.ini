; This is a mxdev configuration file
; it can be used to override versions of packages already defined in the
; constraints files and to add new packages from VCS like git.
; to learn more about mxdev visit https://pypi.org/project/mxdev/

[settings]
main-package = -e .[test]

; Plone's constraints pin an lxml that predates Python 3.14, and lxml is the one
; dependency here with external C libraries: with no cp314 wheel, uv falls back to
; a source build and dies on missing libxml2/libxslt headers. 6.1.1 is the first
; release publishing cp314 wheels, and it publishes cp312/cp313 too, so the same
; pin serves every row of the matrix.
;
; Revisit when Plone's own constraints catch up; this override exists only to
; unblock 3.14 and is not a preference about lxml versions.
version-overrides =
    lxml==6.1.1

; example section to use packages from git
; [example.contenttype]
; url = https://github.com/collective/example.contenttype.git
; pushurl = git@github.com:collective/example.contenttype.git
; extras = test
; branch = main
