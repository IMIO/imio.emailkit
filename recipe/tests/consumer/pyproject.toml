# A minimal external consumer addon, used by the buildout acceptance harness.
# Proves the in-package `emails/`+`templates/` layout and the
# `emails/.kit/` wiring contract, which `imio.emailkit` alone cannot.

[project]
name = "emailkitdemo"
version = "0.1.0"
description = "Throwaway consumer addon for imio.recipe.emailkit's acceptance test"
requires-python = ">=3.10"
# No dependency on imio.emailkit: the recipe resolves the kit from the part's eggs.
dependencies = []

[build-system]
requires = ["setuptools>=68.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.zcml", "*.pt"]
