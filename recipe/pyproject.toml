[project]
name = "imio.recipe.emailkit"
dynamic = ["version"]
description = "Buildout recipe generating bin/compile-emails, bin/check-emails and bin/preview-emails for imio.emailkit consumers"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Antoine Duchêne", email = "antoine.duchene@imio.be" }]
keywords = ["buildout", "recipe", "Plone", "email", "Maizzle"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Framework :: Buildout",
    "Framework :: Buildout :: Recipe",
    "Framework :: Plone",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# `imio.emailkit`, Node and npm are not dependencies: a buildout with no
# emailkit consumer must not drag Plone into the buildout interpreter.
dependencies = [
    "setuptools",
    "zc.buildout",
    "zc.recipe.egg",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/IMIO/imio.emailkit"
PyPI = "https://pypi.org/project/imio.recipe.emailkit"
Source = "https://github.com/IMIO/imio.emailkit"
Tracker = "https://github.com/IMIO/imio.emailkit/issues"

[project.entry-points."zc.buildout"]
default = "imio.recipe.emailkit:Recipe"

[tool.uv]
managed = false

[build-system]
# setuptools: zc.buildout's `develop` needs a `setup.py`. >=77 for the
# PEP 639 SPDX `license` expression above.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "imio.recipe.emailkit.__version__" }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
# PEP 420: shares the `imio` namespace with `imio.emailkit`.
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.txt", "*.js", "*.css", "*.vue"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
lint.select = [
    "YTT", "S", "B", "A", "C4", "T10", "SIM", "C90",
    "E", "W", "F", "PGH", "UP", "RUF",
]

[tool.ruff.lint.isort]
case-sensitive = false
no-sections = true
force-single-line = true
from-first = true
lines-after-imports = 2
lines-between-types = 1
order-by-type = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "RUF001", "S101"]
# The generated `.vue` skeleton carries a real Tailwind class list; wrapping
# it to 88 columns would make it not match a real template.
"src/imio/recipe/emailkit/scaffold.py" = ["E501"]

[tool.zest-releaser]
python-file-with-version = "src/imio/recipe/emailkit/__init__.py"
# Prefixed: shares a git repository and tag namespace with `imio.emailkit`.
tag-format = "imio.recipe.emailkit-{version}"
tag-message = "Release imio.recipe.emailkit {version}"
