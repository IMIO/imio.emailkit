<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
  <head>
    <meta charset="utf-8">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <!--[if mso]>
      <style>
        td,th,div,p,a,h1,h2,h3,h4,h5,h6 {font-family: "Segoe UI", sans-serif; mso-line-height-rule: exactly;}
      </style>
    <![endif]-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="screen">
    <style>
      .m-0 {
        margin: 0 !important;
      }
      .size-full {
        width: 100% !important;
        height: 100% !important;
      }
      .p-0 {
        padding: 0 !important;
      }
      .font-inter {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", Ubuntu, Cantarell, "Helvetica Neue", sans-serif !important;
      }
      .text-base {
        font-size: 16px !important;
        line-height: 24px !important;
      }
      .text-sm {
        font-size: 14px !important;
        line-height: 20px !important;
      }
      .font-size-max16px_1rem {
        font-size: max(16px, 1rem) !important;
      }
      .font-bold {
        font-weight: 700 !important;
      }
      .word-break-break-word {
        word-break: break-word !important;
      }
      .text-gray-600 {
        color: #4b5563 !important;
      }
      .text-gray-700 {
        color: #374151 !important;
      }
      .text-white {
        color: #fffffe !important;
      }
    </style>
  </head>
  <body xml:lang="en" class="m-0 p-0 size-full word-break-break-word">
    <span style="display:none;">
      <!--[if mso]>
        <xml>
          <o:OfficeDocumentSettings>
            <o:PixelsPerInch>96</o:PixelsPerInch>
          </o:OfficeDocumentSettings>
          <w:WordDocument>
            <w:DontUseAdvancedTypographyReadingMail />
          </w:WordDocument>
        </xml>
      <![endif]-->
    </span>
    <div role="article" aria-roledescription="email" lang="en" dir="ltr" style="font-size:medium;" data-juice-duplicates class="font-size-max16px_1rem font-inter">
      <p class="text-sm text-gray-600">this should inline, but will not</p>
      <a href="#" style="background-color:${theme/primary_color" class="text-sm font-bold text-white">literal token</a>
      <p class="text-base text-gray-700">neither will this</p>
    </div>
  </body>
</html>
