name: "Docs"

# Separate from main.yml so a docs issue never blocks the Python suite.
on:
  push:
    paths:
      - 'docs/site/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy in progress: it can leave Pages half-uploaded.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    working-directory: docs/site

jobs:

  build:
    name: "Docs: Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build the static site
        # Read from the repository name, so a fork builds with no edit.
        env:
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/out

  deploy:
    name: "Docs: Deploy to GitHub Pages"
    # Only the default branch publishes.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
