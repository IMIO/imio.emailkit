name: "Main CI"

on:
  push:
  workflow_dispatch:

jobs:

  config:
    name: "Config: Compute values used in workflow"
    uses: ./.github/workflows/config.yml

  lint:
    name: "Backend: Lint"
    needs:
      - config
    uses: plone/meta/.github/workflows/backend-lint.yml@2.x
    with:
      python-version: ${{ needs.config.outputs.python-version }}
      plone-version: ${{ needs.config.outputs.plone-version }}
      # Excludes the compiled .pt files, which are Maizzle build output.
      # Same value as ZPRETTY_INCLUDE in the Makefile; keep both in step.
      zpretty-options: '--include \.(xml|zcml)$'

  test:
    name: "Backend: Test"
    needs:
      - config
    uses: plone/meta/.github/workflows/backend-pytest.yml@2.x
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        # 6.0 does not support Python 3.13.
        plone-version: ['6.2-latest', '6.1-latest']
    with:
      python-version: ${{ matrix.python-version }}
      plone-version: ${{ matrix.plone-version }}

  # The staleness check: checks the compiled `.pt` matches its sources. Node
  # appears in this job and nowhere else.
  emails:
    name: "Emails: Build output is not stale"
    needs:
      - config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The Makefile errors at parse time when `uv` is absent.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the Maizzle toolchain
        run: |
          set -euo pipefail
          cd emails
          # Strict `npm ci`, with no `npm install` fallback: a fallback could
          # resolve a different toolchain than the lockfile pins.
          npm ci

      - name: Rebuild the templates
        run: |
          set -euo pipefail
          # `make build-emails`, not a bare `npx maizzle build`: it also
          # copies the hand-authored twins back in. See emails/twins/README.md.
          make build-emails

      - name: Fail if the committed .pt files differ from a fresh build
        run: |
          set -euo pipefail
          if ! git diff --quiet -- \
              src/imio/emailkit/templates src/imio/emailkit/browser/overrides; then
            echo "::error::Committed email templates are stale. Run 'make build-emails' and commit the result."
            echo '### Stale email build output' >> $GITHUB_STEP_SUMMARY
            echo '```diff' >> $GITHUB_STEP_SUMMARY
            git diff -- src/imio/emailkit/templates src/imio/emailkit/browser/overrides \
              >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          # An untracked .pt is stale too.
          untracked="$(git ls-files --others --exclude-standard -- \
            src/imio/emailkit/templates src/imio/emailkit/browser/overrides)"
          if [ -n "$untracked" ]; then
            echo "::error::Built but never committed:"
            echo "$untracked"
            exit 1
          fi
          echo "Email build output is up to date."

  # `imio.recipe.emailkit`: checks `git clone && buildout &&
  # bin/compile-emails` with node/npm/npx removed from buildout's PATH.
  recipe:
    name: "Recipe: Tests and the buildout acceptance test"
    needs:
      - config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.config.outputs.python-version }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `recipe/` has its own ruff config, outside `make lint`'s RUFF_TARGETS.
      - name: Lint imio.recipe.emailkit
        run: |
          set -euo pipefail
          uvx ruff@latest check --no-fix recipe
          uvx ruff@latest format --check recipe

      - name: imio.recipe.emailkit's own test suite
        run: make recipe-test
        env:
          PLONE_VERSION: ${{ needs.config.outputs.plone-version }}

      - name: "Acceptance: buildout (no Node on PATH), then the three scripts"
        run: make buildout-test
        env:
          PLONE_VERSION: ${{ needs.config.outputs.plone-version }}

      - name: The working tree is unchanged
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            echo "::error::the acceptance test modified tracked files"
            git diff --stat
            exit 1
          fi

  coverage:
    name: "Backend: Test Coverage"
    uses: plone/meta/.github/workflows/backend-pytest-coverage.yml@2.x
    needs:
      - config
    with:
      python-version: ${{ needs.config.outputs.python-version }}
      plone-version: ${{ needs.config.outputs.plone-version }}

  report:
    name: "Final report"
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - config
      - lint
      - test
      - emails
      - recipe
      - coverage
    steps:
      - name: Report
        shell: bash
        run: |
          echo '# Workflow Report' >> $GITHUB_STEP_SUMMARY
          echo '| Job ID | Conclusion |' >> $GITHUB_STEP_SUMMARY
          echo '| --- | --- |' >> $GITHUB_STEP_SUMMARY
          echo '| Config | ${{ needs.config.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Lint | ${{ needs.lint.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Test | ${{ needs.test.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Emails (staleness) | ${{ needs.emails.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Recipe + buildout acceptance | ${{ needs.recipe.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Coverage | ${{ needs.coverage.result }} |' >> $GITHUB_STEP_SUMMARY
