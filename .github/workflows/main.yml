name: "Main CI"

on:
  push:
  workflow_dispatch:

jobs:

  config:
    name: "Config: Compute values used in workflow"
    uses: ./.github/workflows/config.yml

  lint:
    name: "Backend: Lint"
    needs:
      - config
    uses: plone/meta/.github/workflows/backend-lint.yml@2.x
    with:
      python-version: ${{ needs.config.outputs.python-version }}
      plone-version: ${{ needs.config.outputs.plone-version }}

  test:
    name: "Backend: Test"
    needs:
      - config
    uses: plone/meta/.github/workflows/backend-pytest.yml@2.x
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        plone-version: ['6.2-latest', '6.1-latest', '6.0-latest']
    with:
      python-version: ${{ matrix.python-version }}
      plone-version: ${{ matrix.plone-version }}

  # SPEC §5's staleness gate, in its Phase 1 Makefile form (§9's sequencing note).
  #
  # This is the gate the whole two-stage architecture rests on: the compiled `.pt`
  # is the production artifact, Node never runs in production, and nothing else
  # notices when someone edits a `.vue` source and forgets to rebuild. Phase 0's
  # standing lesson applies -- failures in this pipeline are silent, not loud, and
  # the build's exit code carries almost no information about correctness.
  #
  # Node appears in this job and nowhere else. It is not a dependency of `test`,
  # of `coverage`, or of any runtime path.
  emails:
    name: "Emails: Build output is not stale"
    needs:
      - config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the Maizzle toolchain
        run: |
          set -euo pipefail
          cd emails
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Rebuild the templates
        run: |
          set -euo pipefail
          cd emails
          npx maizzle build

      - name: Fail if the committed .pt files differ from a fresh build
        run: |
          set -euo pipefail
          if ! git diff --quiet -- \
              src/imio/emailkit/templates src/imio/emailkit/browser/overrides; then
            echo "::error::Committed email templates are stale. Run 'make build-emails' and commit the result."
            echo '### Stale email build output' >> $GITHUB_STEP_SUMMARY
            echo '```diff' >> $GITHUB_STEP_SUMMARY
            git diff -- src/imio/emailkit/templates src/imio/emailkit/browser/overrides \
              >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          # An untracked .pt is just as stale: a new template that was built but
          # never added is missing from the sdist and from every deployment.
          untracked="$(git ls-files --others --exclude-standard -- \
            src/imio/emailkit/templates src/imio/emailkit/browser/overrides)"
          if [ -n "$untracked" ]; then
            echo "::error::Built but never committed:"
            echo "$untracked"
            exit 1
          fi
          echo "Email build output is up to date."

  # SPEC §9 phase 4: `imio.recipe.emailkit`, the second distribution in this
  # repository, and the acceptance criterion it exists to satisfy --
  # `git clone && buildout && bin/compile-emails` from a clean checkout.
  #
  # Two things this job is here to keep true, both of them hard boundaries:
  #
  #  1. **buildout invokes no Node.** `make buildout-test` runs the whole buildout
  #     with node, npm and npx removed from PATH. SPEC §5's "Explicitly rejected"
  #     section is the reason: compiling at buildout time would make Node a
  #     production dependency across ~350 applications.
  #  2. **the generated scripts work**, which no unit test can establish -- a
  #     buildout-generated script builds its own `sys.path` from lines inside
  #     itself, so only a real buildout produces the thing under test.
  #
  # Node is installed here because `bin/compile-emails` needs it *after* buildout
  # has finished, which is exactly the separation the whole architecture rests on.
  recipe:
    name: "Recipe: Tests and the buildout acceptance test"
    needs:
      - config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.config.outputs.python-version }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `recipe/` has its own ruff config and is outside the house `make lint`'s
      # RUFF_TARGETS (`src tests scripts`), so it is linted here or nowhere.
      - name: Lint imio.recipe.emailkit
        run: |
          set -euo pipefail
          uvx ruff@latest check --no-fix recipe
          uvx ruff@latest format --check recipe

      # Runs in two environments on purpose: recipe/.venv has zc.buildout but no
      # Plone, .venv has Plone but no buildout. Neither run alone covers the suite;
      # the union does, and the skip counts in the log are the record of which half
      # covered what.
      - name: imio.recipe.emailkit's own test suite
        run: make recipe-test
        env:
          PLONE_VERSION: ${{ needs.config.outputs.plone-version }}

      - name: "Acceptance: buildout (no Node on PATH), then the three scripts"
        run: make buildout-test
        env:
          PLONE_VERSION: ${{ needs.config.outputs.plone-version }}

      # The scripts must not have left the working tree holding a build nobody
      # asked for. `check-emails` restores on a `finally`; this is the independent
      # check that it really does.
      - name: The working tree is unchanged
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            echo "::error::the acceptance test modified tracked files"
            git diff --stat
            exit 1
          fi

  coverage:
    name: "Backend: Test Coverage"
    uses: plone/meta/.github/workflows/backend-pytest-coverage.yml@2.x
    needs:
      - config
    with:
      python-version: ${{ needs.config.outputs.python-version }}
      plone-version: ${{ needs.config.outputs.plone-version }}

  report:
    name: "Final report"
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - config
      - lint
      - test
      - emails
      - recipe
      - coverage
    steps:
      - name: Report
        shell: bash
        run: |
          echo '# Workflow Report' >> $GITHUB_STEP_SUMMARY
          echo '| Job ID | Conclusion |' >> $GITHUB_STEP_SUMMARY
          echo '| --- | --- |' >> $GITHUB_STEP_SUMMARY
          echo '| Config | ${{ needs.config.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Lint | ${{ needs.lint.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Test | ${{ needs.test.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Emails (staleness) | ${{ needs.emails.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Recipe + buildout acceptance | ${{ needs.recipe.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Coverage | ${{ needs.coverage.result }} |' >> $GITHUB_STEP_SUMMARY
