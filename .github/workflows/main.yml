name: "Main CI"

on:
  push:
  workflow_dispatch:

jobs:

  config:
    name: "Config: Compute values used in workflow"
    uses: ./.github/workflows/config.yml

  lint:
    name: "Backend: Lint"
    needs:
      - config
    uses: plone/meta/.github/workflows/backend-lint.yml@2.x
    with:
      python-version: ${{ needs.config.outputs.python-version }}
      plone-version: ${{ needs.config.outputs.plone-version }}
      # zpretty must never see the compiled .pt files under src/. They are Maizzle
      # build output, and zpretty's formatting is not Maizzle's, so reformatting
      # them would make `make check-emails` fail forever: the two gates would
      # fight, and the staleness gate is the one that protects production.
      #
      # The upstream default path is `src`, which makes zpretty recurse into every
      # .pt it finds, so the narrowing happens through zpretty's own --include
      # instead of through a file list.
      #
      # This was a `$(find ...)` in zpretty-check-path, on the assumption that the
      # reusable workflow interpolated the value unquoted into a bash line and the
      # command substitution would run. It does interpolate it unquoted -- but out
      # of an env var, and bash expands those without evaluating them, so zpretty
      # received the literal string and exited 2 on every run since:
      #
      #     zpretty: error: unrecognized arguments: -name '*.zcml' -o -name '*.xml' | sort)
      #
      # An --include pattern needs no shell. Word-splitting still separates the two
      # arguments, and nothing in the pattern is a glob character, so it arrives
      # intact. Same value as ZPRETTY_INCLUDE in the Makefile, so the two cannot
      # drift -- and `make lint` now reproduces this job rather than approximating
      # it.
      zpretty-options: '--include \.(xml|zcml)$'

  test:
    name: "Backend: Test"
    needs:
      - config
    uses: plone/meta/.github/workflows/backend-pytest.yml@2.x
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        # 6.0 dropped: it does not support Python 3.13, so a quarter of its rows
        # can only ever fail on dependency resolution.
        plone-version: ['6.2-latest', '6.1-latest']
    with:
      python-version: ${{ matrix.python-version }}
      plone-version: ${{ matrix.plone-version }}

  # The staleness gate, in its Phase 1 Makefile form (see the sequencing note).
  #
  # This is the gate the whole two-stage architecture rests on: the compiled `.pt`
  # is the production artifact, Node never runs in production, and nothing else
  # notices when someone edits a `.vue` source and forgets to rebuild. Phase 0's
  # standing lesson applies -- failures in this pipeline are silent, not loud, and
  # the build's exit code carries almost no information about correctness.
  #
  # Node appears in this job and nowhere else. It is not a dependency of `test`,
  # of `coverage`, or of any runtime path.
  emails:
    name: "Emails: Build output is not stale"
    needs:
      - config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The Makefile hard-errors at parse time when `uv` is absent, and the build
      # step below goes through `make build-emails` so that CI and the developer
      # build identically. `build-emails` itself needs only Node; uv is here to
      # satisfy the guard, not because this job installs Python.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the Maizzle toolchain
        run: |
          set -euo pipefail
          cd emails
          # Strict `npm ci`, with no `npm install` fallback. A fallback resolves a
          # different toolchain than the lockfile pins, so the rebuild below emits
          # different bytes and the staleness gate then reports the committed
          # templates as stale when what actually drifted was Maizzle. A bad
          # lockfile has to fail here, with npm's own message, rather than three
          # steps later wearing someone else's name.
          #
          # If this ever fails with `Missing: ... from lock file`, the lockfile was
          # regenerated on top of an existing node_modules, which makes npm record
          # that tree instead of a full resolution and silently drop the optional
          # platform packages. Regenerate with BOTH removed:
          #   cd emails && rm -rf node_modules package-lock.json && npm install
          npm ci

      - name: Rebuild the templates
        run: |
          set -euo pipefail
          # `make build-emails`, NOT a bare `npx maizzle build`.
          #
          # `maizzle build` empties its output directory, silently, so the
          # hand-authored `.txt.pt` plaintext twins are kept in `emails/twins/` as
          # source and copied into the package after the build. That copy lives in
          # `make build-emails`; a bare `maizzle build` therefore leaves every twin
          # deleted, and the staleness check below reports those deletions as stale
          # templates -- which is a real diff, just not the one the message names.
          # See `emails/twins/README.md`.
          #
          # Calling the same target the developer calls is also the only way this
          # gate means anything: if CI builds differently from `make`, it is
          # comparing against something nobody produces.
          make build-emails

      - name: Fail if the committed .pt files differ from a fresh build
        run: |
          set -euo pipefail
          if ! git diff --quiet -- \
              src/imio/emailkit/templates src/imio/emailkit/browser/overrides; then
            echo "::error::Committed email templates are stale. Run 'make build-emails' and commit the result."
            echo '### Stale email build output' >> $GITHUB_STEP_SUMMARY
            echo '```diff' >> $GITHUB_STEP_SUMMARY
            git diff -- src/imio/emailkit/templates src/imio/emailkit/browser/overrides \
              >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          # An untracked .pt is just as stale: a new template that was built but
          # never added is missing from the sdist and from every deployment.
          untracked="$(git ls-files --others --exclude-standard -- \
            src/imio/emailkit/templates src/imio/emailkit/browser/overrides)"
          if [ -n "$untracked" ]; then
            echo "::error::Built but never committed:"
            echo "$untracked"
            exit 1
          fi
          echo "Email build output is up to date."

  # Phase 4: `imio.recipe.emailkit`, the second distribution in this
  # repository, and the acceptance criterion it exists to satisfy --
  # `git clone && buildout && bin/compile-emails` from a clean checkout.
  #
  # Two things this job is here to keep true, both of them hard boundaries:
  #
  #  1. **buildout invokes no Node.** `make buildout-test` runs the whole buildout
  #     with node, npm and npx removed from PATH. Compiling at buildout time is
  #     explicitly rejected: it would make Node a production dependency across
  #     ~350 applications.
  #  2. **the generated scripts work**, which no unit test can establish -- a
  #     buildout-generated script builds its own `sys.path` from lines inside
  #     itself, so only a real buildout produces the thing under test.
  #
  # Node is installed here because `bin/compile-emails` needs it *after* buildout
  # has finished, which is exactly the separation the whole architecture rests on.
  recipe:
    name: "Recipe: Tests and the buildout acceptance test"
    needs:
      - config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.config.outputs.python-version }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `recipe/` has its own ruff config and is outside the house `make lint`'s
      # RUFF_TARGETS (`src tests scripts`), so it is linted here or nowhere.
      - name: Lint imio.recipe.emailkit
        run: |
          set -euo pipefail
          uvx ruff@latest check --no-fix recipe
          uvx ruff@latest format --check recipe

      # Runs in two environments on purpose: recipe/.venv has zc.buildout but no
      # Plone, .venv has Plone but no buildout. Neither run alone covers the suite;
      # the union does, and the skip counts in the log are the record of which half
      # covered what.
      - name: imio.recipe.emailkit's own test suite
        run: make recipe-test
        env:
          PLONE_VERSION: ${{ needs.config.outputs.plone-version }}

      - name: "Acceptance: buildout (no Node on PATH), then the three scripts"
        run: make buildout-test
        env:
          PLONE_VERSION: ${{ needs.config.outputs.plone-version }}

      # The scripts must not have left the working tree holding a build nobody
      # asked for. `check-emails` restores on a `finally`; this is the independent
      # check that it really does.
      - name: The working tree is unchanged
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            echo "::error::the acceptance test modified tracked files"
            git diff --stat
            exit 1
          fi

  coverage:
    name: "Backend: Test Coverage"
    uses: plone/meta/.github/workflows/backend-pytest-coverage.yml@2.x
    needs:
      - config
    with:
      python-version: ${{ needs.config.outputs.python-version }}
      plone-version: ${{ needs.config.outputs.plone-version }}

  report:
    name: "Final report"
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - config
      - lint
      - test
      - emails
      - recipe
      - coverage
    steps:
      - name: Report
        shell: bash
        run: |
          echo '# Workflow Report' >> $GITHUB_STEP_SUMMARY
          echo '| Job ID | Conclusion |' >> $GITHUB_STEP_SUMMARY
          echo '| --- | --- |' >> $GITHUB_STEP_SUMMARY
          echo '| Config | ${{ needs.config.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Lint | ${{ needs.lint.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Test | ${{ needs.test.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Emails (staleness) | ${{ needs.emails.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Recipe + buildout acceptance | ${{ needs.recipe.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Coverage | ${{ needs.coverage.result }} |' >> $GITHUB_STEP_SUMMARY
